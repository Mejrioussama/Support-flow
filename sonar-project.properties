sonar.projectKey=SupportFlow
sonar.projectName=SupportFlow
sonar.projectVersion=1.0
sonar.sourceEncoding=UTF-8

# Backend + frontend sources
sonar.sources=backend/src/main/java,frontend/src
sonar.tests=backend/src/test/java

# Java compilation outputs required for backend analysis
sonar.java.binaries=backend/target/classes
sonar.java.test.binaries=backend/target/test-classes

# TypeScript support
sonar.typescript.tsconfigPath=frontend/tsconfig.json

# Ignore generated/build folders
sonar.exclusions=**/node_modules/**,**/dist/**,**/target/**,**/coverage/**,**/*.spec.ts,**/*.test.ts
sonar.test.exclusions=frontend/src/**/*.spec.ts
