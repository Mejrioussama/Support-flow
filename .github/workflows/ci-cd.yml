name: SupportFlow CI/CD GitOps

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  security-events: write

env:
  JAVA_VERSION: '17'
  NODE_VERSION: '18'
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ghcr.io/mejrioussama
  BACKEND_IMAGE: ghcr.io/mejrioussama/supportflow-backend
  FRONTEND_IMAGE: ghcr.io/mejrioussama/supportflow-frontend
  K8S_ENV: ${{ github.ref == 'refs/heads/main' && 'prod' || 'staging' }}

jobs:
  remote-readiness:
    name: GitOps Repo Readiness
    runs-on: ubuntu-latest
    outputs:
      remote_ready: ${{ steps.readiness.outputs.remote_ready }}
    steps:
      - uses: actions/checkout@v4
      - name: Evaluate remote readiness
        id: readiness
        shell: bash
        run: |
          remote_ready=true

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "remote_ready=false" >> "$GITHUB_OUTPUT"
            echo "Pull request run - remote deployment checks skipped." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "ArgoCD token-based sync is not required: applications use automated sync from Git." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [ -d argocd ] && grep -R "https://github.com/example/support-flow.git" argocd >/dev/null 2>&1; then
            remote_ready=false
            echo "ArgoCD manifests still point to the example repository." >> "$GITHUB_STEP_SUMMARY"
            echo "Run scripts/configure-remote-gitops.ps1 with the real GitHub repo URL before pushing." >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "$remote_ready" = true ]; then
            echo "Remote deployment stage is ready to run." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "GitOps deployment jobs will be skipped until repository readiness is complete." >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "remote_ready=$remote_ready" >> "$GITHUB_OUTPUT"
          exit 0

  backend-build:
    name: Build Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven
      - name: Maven verify
        run: mvn clean verify -DskipTests=false

  migration-validation:
    name: Validate MySQL Migrations
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - name: Create empty and restored-schema databases
        run: |
          mysql -h127.0.0.1 -uroot -proot -e "CREATE DATABASE supportflow_empty; CREATE DATABASE supportflow_existing;"
          mysql -h127.0.0.1 -uroot -proot supportflow_existing < backend/src/main/resources/db/migration/V1__baseline_schema.sql
          mysql -h127.0.0.1 -uroot -proot supportflow_existing -e "INSERT INTO clients (created_at, code, company_name) VALUES (NOW(6), 'CI', 'CI Client'); INSERT INTO tickets (created_at, reference, title, type, status, severity, impact, priority, client_id) VALUES (NOW(6), 'SF-9000', 'Migration preservation check', 'INCIDENT', 'NEW', 'LOW', 'LOW', 'LOW', 1);"
      - name: Migrate an empty database
        run: |
          docker run --rm --network host -v "$PWD/backend/src/main/resources/db/migration:/flyway/sql:ro" flyway/flyway:9.22.3-alpine -url="jdbc:mysql://127.0.0.1:3306/supportflow_empty?allowPublicKeyRetrieval=true&useSSL=false" -user=root -password=root migrate
      - name: Baseline and migrate a restored current schema
        run: |
          docker run --rm --network host -v "$PWD/backend/src/main/resources/db/migration:/flyway/sql:ro" flyway/flyway:9.22.3-alpine -url="jdbc:mysql://127.0.0.1:3306/supportflow_existing?allowPublicKeyRetrieval=true&useSSL=false" -user=root -password=root -baselineVersion=1 baseline
          docker run --rm --network host -v "$PWD/backend/src/main/resources/db/migration:/flyway/sql:ro" flyway/flyway:9.22.3-alpine -url="jdbc:mysql://127.0.0.1:3306/supportflow_existing?allowPublicKeyRetrieval=true&useSSL=false" -user=root -password=root migrate
          test "$(mysql -N -h127.0.0.1 -uroot -proot supportflow_existing -e "SELECT COUNT(*) FROM tickets WHERE reference='SF-9000'")" = "1"
          test "$(mysql -N -h127.0.0.1 -uroot -proot supportflow_existing -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='supportflow_existing' AND table_name='workflow_sync_jobs'")" = "1"

  frontend-build:
    name: Build Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Unit tests
        run: npm test -- --watch=false --browsers=ChromeHeadless
      - name: Build production
        run: npm run build -- --configuration=production

  kubernetes-validation:
    name: Validate Kubernetes Manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
        with:
          version: latest
      - name: Render all overlays
        shell: bash
        run: |
          kubectl kustomize k8s/overlays/local > /tmp/supportflow-local.yaml
          kubectl kustomize k8s/overlays/staging > /tmp/supportflow-staging.yaml
          kubectl kustomize k8s/overlays/prod > /tmp/supportflow-prod.yaml
      - name: Reject committed runtime secrets
        shell: bash
        run: |
          if grep -R --include='*.yaml' --exclude='*.example.yaml' -E '^[[:space:]]+(DB_PASSWORD|MYSQL_ROOT_PASSWORD|JWT_SECRET|ALFRESCO_PASSWORD):[[:space:]]+[^<].+' k8s/base k8s/overlays; then
            echo 'A runtime secret appears to be committed in Kubernetes manifests.'
            exit 1
          fi

  compose-smoke:
    name: Docker Compose Workflow Smoke
    runs-on: ubuntu-latest
    needs: [backend-build, migration-validation]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Start core workflow stack
        run: docker compose up -d --build mysql keycloak backend
      - name: Verify readiness and production auth lockdown
        shell: bash
        run: |
          for i in {1..90}; do
            if curl -fsS http://localhost:8082/api/actuator/health/readiness >/dev/null; then
              break
            fi
            if [ "$i" = 90 ]; then
              docker compose logs backend keycloak mysql
              exit 1
            fi
            sleep 5
          done
          auth_status=$(curl -sS -o /dev/null -w "%{http_code}" -X POST -H "Content-Type: application/json" -d '{"username":"ci","password":"ci"}' http://localhost:8082/api/auth/login)
          test "$auth_status" = "401" -o "$auth_status" = "404"
          curl -fsS http://localhost:8082/api/actuator/health/integrations >/dev/null
      - name: Stop stack
        if: always()
        run: docker compose down -v

  code-quality:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    needs: [backend-build, frontend-build]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci
      - name: Start ephemeral SonarQube stack
        run: docker compose --profile tools up -d sonarqube-postgres sonarqube
      - name: Wait for SonarQube to be ready
        shell: bash
        run: |
          for i in {1..90}; do
            status=$(curl -fsS http://localhost:9000/api/system/status 2>/dev/null | grep -o '"status":"[A-Z]*"' | cut -d'"' -f4 || true)
            if [ "$status" = "UP" ]; then
              echo "SonarQube is UP."
              exit 0
            fi
            sleep 5
          done
          docker logs supportflow-sonarqube || true
          exit 1
      - name: Generate SonarQube token
        shell: bash
        run: |
          response=$(curl -fsS -u admin:admin -X POST "http://localhost:9000/api/user_tokens/generate?name=github-actions-ci")
          token=$(grep -o '"token":"[^"]*"' <<< "$response" | cut -d'"' -f4)
          echo "SONAR_HOST_URL=http://localhost:9000" >> "$GITHUB_ENV"
          echo "SONAR_TOKEN=$token" >> "$GITHUB_ENV"
      - name: Backend SonarQube
        working-directory: ./backend
        run: >
          mvn clean verify sonar:sonar
          -Dsonar.projectKey=supportflow-backend
          -Dsonar.host.url=$SONAR_HOST_URL
          -Dsonar.login=$SONAR_TOKEN
      - name: Frontend SonarQube
        working-directory: ./frontend
        run: >
          npx sonar-scanner
          -Dsonar.projectKey=supportflow-frontend
          -Dsonar.sources=src
          -Dsonar.host.url=$SONAR_HOST_URL
          -Dsonar.login=$SONAR_TOKEN
      - name: Stop ephemeral SonarQube stack
        if: always()
        run: docker compose --profile tools down -v

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [backend-build, frontend-build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven
      # Trivy's fs scan resolves the full pom.xml dependency tree against Maven Central to
      # check versions for known CVEs. Without a warm ~/.m2 cache this job's fresh runner hits
      # Maven Central cold on every run and gets 429 Too Many Requests under shared GitHub-hosted
      # runner IP pool load, which fails the whole job in seconds before any real scan happens.
      # setup-java's cache: maven restores the same cache backend-build already populated (same
      # pom.xml hash); this explicit resolve is the fallback trivy's own error message recommends.
      - name: Populate Maven cache for dependency scanning
        working-directory: ./backend
        run: ./mvnw dependency:resolve -B -q
      # Maintained GitHub Action pinned to a specific release, instead of the previous
      # `curl https://.../main/contrib/install.sh | sh` (fetched from a mutable branch with no
      # checksum verification). Report step never fails the job, so the SARIF upload always runs
      # even when vulnerabilities are found.
      - name: Trivy filesystem scan (report)
        uses: aquasecurity/trivy-action@v0.33.1
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          exit-code: 0
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: trivy-results.sarif
      # Gate step: previously `trivy fs` ran with no --exit-code, so it always exited 0 and
      # Critical/High findings never blocked docker-build/deploy. This fails the job (and the
      # docker-build/update-gitops-manifests/argocd-sync chain that depends on it) on real findings.
      - name: Trivy filesystem scan (fail on Critical/High)
        uses: aquasecurity/trivy-action@v0.33.1
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: CRITICAL,HIGH
          exit-code: 1

  docker-build:
    name: Build and Push Images
    runs-on: ubuntu-latest
    needs: [backend-build, frontend-build, migration-validation, kubernetes-validation, compose-smoke, security-scan, code-quality]
    if: github.event_name != 'pull_request'
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.BACKEND_IMAGE }}
            ${{ env.FRONTEND_IMAGE }}
          tags: |
            type=sha
            type=ref,event=branch
      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:sha-${{ github.sha }}
            ${{ env.BACKEND_IMAGE }}:${{ env.K8S_ENV }}
      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:sha-${{ github.sha }}
            ${{ env.FRONTEND_IMAGE }}:${{ env.K8S_ENV }}

  update-gitops-manifests:
    name: Update GitOps Manifests
    runs-on: ubuntu-latest
    needs: [docker-build, remote-readiness]
    if: github.event_name != 'pull_request' && needs.docker-build.result == 'success' && needs.remote-readiness.outputs.remote_ready == 'true'
    permissions:
      contents: write
    # Every prior job (build/test/scan) runs attacker-influenceable code (mvn/npm dependency
    # resolution, Trivy, SonarQube) with the same ambient GITHUB_TOKEN this job then uses with
    # contents: write to push straight to main/develop, which ArgoCD auto-syncs to the cluster
    # with no further human checkpoint. Declaring a GitHub Environment here lets a repo admin
    # attach required-reviewer protection rules (Settings > Environments > prod) so a compromised
    # upstream dependency can't push an arbitrary image reference straight to a running prod
    # deployment - this workflow change alone does not enforce that; the Environment's protection
    # rules must still be configured in the repo settings for "prod" to actually gate anything.
    environment: ${{ github.ref == 'refs/heads/main' && 'prod' || 'staging' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Update backend image tag
        run: |
          sed -i "s#image: ghcr.io/.*/supportflow-backend:.*#image: ${{ env.BACKEND_IMAGE }}:sha-${{ github.sha }}#g" k8s/overlays/${{ env.K8S_ENV }}/backend-patch.yaml
      - name: Update frontend image tag
        run: |
          sed -i "s#image: ghcr.io/.*/supportflow-frontend:.*#image: ${{ env.FRONTEND_IMAGE }}:sha-${{ github.sha }}#g" k8s/overlays/${{ env.K8S_ENV }}/frontend-patch.yaml
      - name: Commit manifest changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/overlays/${{ env.K8S_ENV }}/backend-patch.yaml k8s/overlays/${{ env.K8S_ENV }}/frontend-patch.yaml
          git diff --cached --quiet || git commit -m "ci: update ${K8S_ENV} manifests for ${GITHUB_SHA}"
          git push

  argocd-sync:
    name: ArgoCD Auto-Sync
    runs-on: ubuntu-latest
    needs: [update-gitops-manifests, remote-readiness]
    if: github.event_name != 'pull_request' && needs.update-gitops-manifests.result == 'success' && needs.remote-readiness.outputs.remote_ready == 'true'
    steps:
      - name: Confirm ArgoCD auto-sync mode
        run: |
          echo "ArgoCD applications are configured with syncPolicy.automated." >> "$GITHUB_STEP_SUMMARY"
          echo "Once manifests are pushed, ArgoCD reconciles them automatically." >> "$GITHUB_STEP_SUMMARY"
